[project]
name = "manga-image-translator"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
requires-python = ">=3.10, <3.12"
license = "GPL-3.0-only"
dependencies = [
    "accelerate>=1.12.0",
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.2",
    "aioshutil>=1.6",
    "arabic-reshaper>=3.0.0",
    "backports-cached-property>=1.0.2",
    "bitsandbytes>=0.48.2",
    "colorama>=0.4.6",
    "cryptography>=46.0.3",
    "ctranslate2>=4.6.1",
    "cython>=3.2.2",
    "deepl>=1.25.0",
    "editdistance>=0.8.1",
    "einops>=0.8.1",
    "fastapi>=0.123.8",
    "freetype-py>=2.5.1",
    "google-genai>=1.2.0",
    "groq>=0.37.1",
    "httpx==0.27.2",
    "huggingface-hub>=0.36.0",
    "imagehash>=4.3.2",
    "kornia>=0.8.2",
    "langcodes>=3.5.1",
    "langdetect>=1.0.9",
    "manga-ocr>=0.1.14",
    "marshmallow>=4.1.0",
    "nest-asyncio>=1.6.0",
    "networkx>=3.4.2",
    "numpy==1.26.4",
    "omegaconf>=2.3.0",
    "onnxruntime>=1.23.2",
    "open-clip-torch>=3.2.0",
    "openai==1.63.0",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "protobuf>=3.20.2,<6.0.0",
    "py3langid==0.2.2",
    "pyclipper>=1.4.0",
    "pydantic==2.5.0",
    "pydensecrf",
    "pyhyphen>=4.0.4",
    "python-bidi>=0.6.7",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "regex>=2025.11.3",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "rusty-manga-image-translator>=0.12.1",
    "safetensors>=0.7.0",
    "scikit-image>=0.25.2",
    "sentencepiece>=0.2.1",
    "shapely>=2.1.2",
    "tensorboardx>=2.6.4",
    "tiktoken>=0.12.0",
    "timm>=1.0.22",
    "torch>=2.9.1",
    "torch-summary>=1.4.5",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
    "transformers>=4.57.3",
    "uvicorn>=0.38.0",
    "websockets>=14.2",
]

[tool.isort]
profile = 'black'
multi_line_output = 3
line_length = 100
py_version = 310


[tool.pylint]
disable = """
C,R,W,
c-extension-no-member
"""
additional-builtins = "display"
output-format = "colorized"
generated-members = ["torch.*", "cv2.*"]

[tool.pytest.ini_options]
addopts = "-ra -v -p no:faulthandler"
minversion = "6.0"
testpaths = ["test"]

[tool.uv.sources]
pydensecrf = { url = "https://github.com/lucasb-eyer/pydensecrf/archive/refs/heads/master.zip" }

[dependency-groups]
dev = [
    "ipykernel==6.29.5",
    "pylint==3.3.0",
    "pytest==7.2.2",
    "pytest-asyncio==0.21.1",
    "pytest-sugar==0.9.6",
    "pytest-xdist==3.3.1",
]
